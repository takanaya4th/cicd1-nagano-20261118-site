name: CI and deploy to S3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 全部のジョブの初期値：リポジトリを読むだけ
permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  S3_BUCKET: cicd1-nagano-20261118-site
  AWS_ROLE_ARN: arn:aws:iam::951187666329:role/cicd1-nagano-20261118-gha-role

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # main への push（と手動実行）のときだけ S3 に上げる。PR では上げない
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # OIDC の身分証（ID トークン）をもらうには id-token: write が要る
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws s3 sync dist/ "s3://${S3_BUCKET}/" --delete
